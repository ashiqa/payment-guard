[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paymentguard"
version = "0.1.0"
description = "Reproducible payment fraud experiments and inference API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<1.9",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "joblib>=1.4,<2", "httpx>=0.27,<1", "threadpoolctl>=3.5,<4"
]

[project.scripts]
paymentguard = "paymentguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
