name: verify
on: [push, pull_request]
jobs:
  pipeline-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Test leakage, reproducibility, thresholds, and API
        run: python -m unittest discover -s tests -v
      - name: Run complete demo pipeline
        run: |
          paymentguard generate --rows 10000
          paymentguard train --data-kind synthetic
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation
          path: artifacts/report.json
